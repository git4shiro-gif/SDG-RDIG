<!DOCTYPE html>
<html lang="en">
<head>
    <title>SDG-RDIG Dashboard</title>
    
</head>
<body>
    <iframe id="app"
    width="100%" height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border:none;"></iframe>
    <script>
        // The exec URL is assembled here (base64-decoded) rather than sitting
        // as plain text in the HTML source, so it no longer shows up in
        // View Source (Ctrl+U) or the raw index.html file.
        // NOTE: this only hides it from "View Source". Anyone who opens
        // DevTools (Inspect Element / Network tab) will still see the real
        // URL once the iframe is live, because that's what the browser is
        // actually loading — no static-site trick can prevent that. If you
        // need the URL to be invisible in DevTools too, that requires a
        // server-side proxy (Cloudflare Worker / Netlify Function) sitting
        // in front of the Apps Script URL — a different kind of fix.
        var _u = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9hL21hY3Jvcy9jaGVkLmdvdi5waC9zL0FLZnljYnhhekhLNkM1aDVEWGJ3dXRsbXFYNEh6NWdfWkFjcmZnb2VaM0dDQ1RBenVITFNmZU5EeGo0Z0I5NTVmb1pCNFJ3Sy9leGVj';
        document.getElementById('app').src = atob(_u);

        window.onload = function() {
            document.querySelector('iframe').requestFullscreen().catch((err)=> {
                console.error('Error attempting to enable full-screen mode: ${err.message}');
            });
        };
    </script>
    </body>
</html>
