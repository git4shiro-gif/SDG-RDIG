<!DOCTYPE html>
<html lang="en">
<head>
    <title>SDG-RDIG Dashboard</title>
    
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbxazHK6C5h5DXbwutlmqX4Hz5g_ZAcrfgoeZ3GCCTAzuHLSfeNDxj4gB955foZB4RwK/exec" 
    width="100%" height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border:none;"></iframe>
    <script>
        window.onload = function() {
            document.querySelector('iframe').requestFullscreen().catch((err)=> {
                console.error('Error attempting to enable full-screen mode: ${err.message}');
            });
        };  
            
    </script>
    </body>
</html>
